    <style>
        .led {
            position: absolute;
            left: 55px;
            top: 30px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: rgb(255, 136, 115);
            box-shadow: inset 0px 1px 0px rgba(0, 0, 0, .1);
            -webkit-animation: led .8s infinite;
            -moz-animation: led .8s infinite;
            -ms-animation: led .8s infinite;
            -o-animation: led .8s infinite;
            animation: led .8s infinite;
        }

        /* keyframes */
        @-webkit-keyframes led {
            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

        @-moz-keyframes led {
            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

        @-ms-keyframes led {
            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

        @-o-keyframes led {
            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes led {
            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

    <!-- 以下是 pop-up pin js part-->
    <script>
        $(document).ready(function () {

            // set the image-map width and height to match the img size
            $('#image-map').css({
                'width': $('#image-map img').width(),
                'height': $('#image-map img').height()
            })

            //tooltip direction
            var tooltipDirection;

            for (i = 0; i < $(".pin").length; i++) {
                // set tooltip direction type - up or down             
                if ($(".pin").eq(i).hasClass('pin-down')) {
                    tooltipDirection = 'tooltip-down';
                } else {
                    tooltipDirection = 'tooltip-up';
                }

                // append the tooltip
                $("#image-map").append("<div style='left:" + $(".pin").eq(i).data('xpos') + "px;top:" + $(".pin").eq(i).data('ypos') + "px' class='" + tooltipDirection + "'>\
                                        <div class='tooltip'>" + $(".pin").eq(i).html() + "</div>\
                                </div>");
            }

            // show/hide the tooltip
            $('.tooltip-up, .tooltip-down').mouseenter(function () {
                $(this).children('.tooltip').fadeIn(100);
            }).mouseleave(function () {
                $(this).children('.tooltip').fadeOut(100);
            })
        });
    </script>
